<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#220308">
    <meta name="description" content="Trust Royale — a Monte Carlo-inspired prize game from Trust Electric Heating.">
    <title>Trust Royale</title>
  </head>
  <body>
    <main id="game" aria-label="Trust Royale slot machine preview">
      <div id="canvas-host" aria-hidden="true"></div>
      <svg class="scene-effects" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="beam-left" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe8a3" stop-opacity=".55"/>
            <stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="beam-right" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe8a3" stop-opacity=".48"/>
            <stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path class="scene-effects__beam scene-effects__beam--left" d="M120 0 L480 1000 L45 1000 Z" fill="url(#beam-left)"/>
        <path class="scene-effects__beam scene-effects__beam--right" d="M880 0 L955 1000 L520 1000 Z" fill="url(#beam-right)"/>
        <g fill="#fff3bd">
          <circle class="scene-effects__spark" cx="130" cy="240" r="4"/>
          <circle class="scene-effects__spark" cx="815" cy="185" r="5"/>
          <circle class="scene-effects__spark" cx="710" cy="690" r="3"/>
          <circle class="scene-effects__spark" cx="250" cy="775" r="4"/>
        </g>
      </svg>
      <div id="ui" class="ui-layer">
        <header id="marquee" class="marquee" aria-label="Trust Royale">
          <svg viewBox="0 0 800 170" role="img" aria-label="Trust Royale, Heating for Humans">
            <defs>
              <linearGradient id="title-gold" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#9b6411"/>
                <stop offset=".32" stop-color="#fff0a9"/>
                <stop offset=".58" stop-color="#d4a437"/>
                <stop offset="1" stop-color="#fff4be"/>
                <animate attributeName="x1" values="-.8;.8" dur="3.2s" repeatCount="indefinite"/>
                <animate attributeName="x2" values=".2;1.8" dur="3.2s" repeatCount="indefinite"/>
              </linearGradient>
            </defs>
            <rect x="42" y="18" width="716" height="132" rx="30" fill="#130307" fill-opacity=".92" stroke="#8f5c12" stroke-width="5"/>
            <rect x="51" y="27" width="698" height="114" rx="24" fill="none" stroke="#e4b94f" stroke-width="2" stroke-opacity=".75"/>
            <g fill="#ffd66d">
              <circle cx="28" cy="45" r="6"><animate attributeName="fill-opacity" values=".35;1;.35" dur="1.6s" repeatCount="indefinite"/></circle>
              <circle cx="772" cy="45" r="6"><animate attributeName="fill-opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
              <circle cx="28" cy="120" r="6"><animate attributeName="fill-opacity" values=".5;1;.5" dur="1.3s" repeatCount="indefinite"/></circle>
              <circle cx="772" cy="120" r="6"><animate attributeName="fill-opacity" values="1;.5;1" dur="1.3s" repeatCount="indefinite"/></circle>
            </g>
            <text class="marquee__title" x="400" y="88" text-anchor="middle" fill="url(#title-gold)">Trust Royale</text>
            <text class="marquee__subtitle" x="400" y="126" text-anchor="middle">Heating for Humans</text>
          </svg>
        </header>
        <section id="paytable" class="paytable" aria-label="Prize paytable">
          <span class="paytable__label">Prize table</span>
          <span class="paytable__rule" aria-label="Keith times three, 25 percent"><span class="paytable__icons"><img src="/assets/mock/keith-medallion.webp" alt=""><img src="/assets/mock/keith-medallion.webp" alt=""><img src="/assets/mock/keith-medallion.webp" alt=""></span><b>25%</b></span>
          <span class="paytable__rule" aria-label="Scott times three, 20 percent"><span class="paytable__icons"><img src="/assets/mock/scott-medallion.webp" alt=""><img src="/assets/mock/scott-medallion.webp" alt=""><img src="/assets/mock/scott-medallion.webp" alt=""></span><b>20%</b></span>
          <span class="paytable__rule" aria-label="Fiona times three, 20 percent"><span class="paytable__icons"><img src="/assets/mock/fiona-medallion.webp" alt=""><img src="/assets/mock/fiona-medallion.webp" alt=""><img src="/assets/mock/fiona-medallion.webp" alt=""></span><b>20%</b></span>
          <span class="paytable__rule" aria-label="Scott times two plus Fiona, 15 percent"><span class="paytable__icons"><img src="/assets/mock/scott-medallion.webp" alt=""><img src="/assets/mock/scott-medallion.webp" alt=""><img src="/assets/mock/fiona-medallion.webp" alt=""></span><b>15%</b></span>
          <span class="paytable__rule" aria-label="Fiona times two plus Scott, 15 percent"><span class="paytable__icons"><img src="/assets/mock/fiona-medallion.webp" alt=""><img src="/assets/mock/fiona-medallion.webp" alt=""><img src="/assets/mock/scott-medallion.webp" alt=""></span><b>15%</b></span>
          <span class="paytable__rule" aria-label="Keith times two plus any, 15 percent"><span class="paytable__icons"><img src="/assets/mock/keith-medallion.webp" alt=""><img src="/assets/mock/keith-medallion.webp" alt=""><i>ANY</i></span><b>15%</b></span>
          <span class="paytable__rule" aria-label="Neos times three, 10 percent"><span class="paytable__icons"><img class="paytable__neos" src="/assets/emblem/neos.svg" alt=""><img class="paytable__neos" src="/assets/emblem/neos.svg" alt=""><img class="paytable__neos" src="/assets/emblem/neos.svg" alt=""></span><b>10%</b></span>
        </section>
        <button id="spin" class="spin" type="button" aria-label="Spin the reels">Spin</button>
      </div>
      <div id="loading" class="loading" role="status">Preparing the table…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
